<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rekkon Graph Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #0a0e1a; color: #e2e8f0; }
#cy { width: 100vw; height: 100vh; }
#controls { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; }
#controls button {
  padding: 6px 12px; border-radius: 6px; border: 1px solid #2d3548;
  background: #111827; color: #e2e8f0; font-size: 12px; cursor: pointer;
}
#controls button:hover { border-color: #3b82f6; }
#info { position: fixed; bottom: 12px; left: 12px; font-size: 11px; color: #64748b; z-index: 10; }
#detail {
  position: fixed; top: 12px; right: 12px; width: 320px; max-height: 80vh;
  background: #111827; border: 1px solid #1e293b; border-radius: 8px;
  padding: 16px; overflow-y: auto; display: none; z-index: 10; font-size: 12px;
}
#detail h3 { margin-bottom: 8px; font-size: 14px; }
#detail .badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px;
  font-weight: 600; margin-bottom: 8px;
}
#detail .field { margin-bottom: 6px; }
#detail .label { color: #64748b; font-size: 10px; text-transform: uppercase; }
#detail .value { color: #cbd5e1; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="cy"></div>
<div id="controls">
  <button onclick="fitGraph()">Fit</button>
  <button onclick="runLayout('cose')">Compound Layout</button>
  <button onclick="runLayout('breadthfirst')">Hierarchy</button>
  <button onclick="toggleSymbols()">Toggle Symbols</button>
  <button onclick="zoomBy(1.3)">+</button>
  <button onclick="zoomBy(0.7)">-</button>
</div>
<div id="info">Loading graph...</div>
<div id="detail"></div>

<script>
const COLORS = {
  API: '#f59e0b',
  Pages: '#8b5cf6',
  UI: '#3b82f6',
  Hooks: '#06b6d4',
  State: '#10b981',
  Lib: '#6366f1',
  Types: '#ec4899',
  Config: '#78716c',
  Services: '#f97316',
  Middleware: '#ef4444',
  Tests: '#a3a3a3',
  Core: '#64748b'
};

const SUBTYPE_COLORS = {
  function: '#3b82f6',
  component: '#8b5cf6',
  hook: '#06b6d4',
  class: '#f59e0b',
  interface: '#ec4899',
  'type-alias': '#ec4899',
  type_alias: '#ec4899',
  enum: '#f97316',
  variable: '#64748b',
  route: '#f59e0b',
  page: '#8b5cf6',
  utility: '#6366f1',
  config: '#78716c',
  test: '#a3a3a3',
  style: '#14b8a6',
  'type-definition': '#ec4899'
};

let cy = null;
let showSymbols = true;

// You can paste graph JSON into GRAPH_DATA; otherwise it fetches local .archviz files.
let GRAPH_DATA = null;

async function init() {
  const raw = await getGraphData();
  if (!raw) {
    setInfo('Could not load .archviz/graph.json or .archviz/cytoscape.json');
    return;
  }

  const normalized = normalizeGraph(raw);
  if (!normalized.elements.length) {
    setInfo('Loaded graph has no elements');
    return;
  }

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: normalized.elements,
    style: [
      {
        selector: 'node[type="layer"]',
        style: {
          'background-color': '#111827',
          'background-opacity': 0.5,
          'border-width': 2,
          'border-color': (ele) => COLORS[ele.data('label')] || '#2d3548',
          label: 'data(label)',
          'font-size': 16,
          'font-weight': 700,
          color: '#94a3b8',
          'text-valign': 'top',
          'text-halign': 'center',
          'text-margin-y': -10,
          shape: 'roundrectangle',
          padding: 24
        }
      },
      {
        selector: 'node[type="module"]',
        style: {
          'background-color': '#1a1f2e',
          'background-opacity': 0.6,
          'border-width': 1,
          'border-color': '#2d3548',
          label: 'data(label)',
          'font-size': 11,
          'font-weight': 600,
          color: '#cbd5e1',
          'text-valign': 'top',
          'text-halign': 'center',
          'text-margin-y': -6,
          shape: 'roundrectangle',
          padding: 14
        }
      },
      {
        selector: 'node[type="file"]',
        style: {
          'background-color': '#232937',
          'border-width': 1.5,
          'border-color': (ele) => {
            const parent = ele.parent();
            const grandParent = parent ? parent.parent() : null;
            const layerLabel = (grandParent && grandParent.data('label')) || (parent && parent.data('label'));
            return COLORS[layerLabel] || '#3b82f6';
          },
          label: 'data(label)',
          'font-size': 9,
          color: '#e2e8f0',
          'text-valign': 'center',
          shape: 'roundrectangle',
          width: 'label',
          height: 26,
          padding: 8
        }
      },
      {
        selector: 'node[type="symbol"]',
        style: {
          'background-color': (ele) => SUBTYPE_COLORS[ele.data('subtype')] || '#64748b',
          width: 14,
          height: 14,
          label: 'data(label)',
          'font-size': 7,
          color: '#94a3b8',
          'text-valign': 'bottom',
          'text-margin-y': 4,
          shape: (ele) => {
            const subtype = ele.data('subtype');
            if (subtype === 'class') return 'diamond';
            if (subtype === 'component') return 'star';
            if (subtype === 'hook' || String(subtype || '').includes('function')) return 'ellipse';
            return 'ellipse';
          }
        }
      },
      {
        selector: 'edge',
        style: {
          width: (ele) => Math.max(1, Math.min(ele.data('weight') || 1, 4)),
          'line-color': '#334155',
          'target-arrow-color': '#334155',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'arrow-scale': 0.7,
          opacity: 0.6
        }
      },
      {
        selector: ':selected',
        style: {
          'border-color': '#3b82f6',
          'border-width': 3,
          'z-index': 999
        }
      },
      {
        selector: '.highlighted',
        style: {
          'border-color': '#f59e0b',
          'border-width': 3,
          'line-color': '#f59e0b',
          'target-arrow-color': '#f59e0b',
          opacity: 1
        }
      },
      { selector: '.dimmed', style: { opacity: 0.15 } }
    ],
    layout: {
      name: 'cose',
      animate: false,
      nodeRepulsion: 8000,
      idealEdgeLength: 80,
      padding: 40
    },
    minZoom: 0.1,
    maxZoom: 5
  });

  cy.on('tap', 'node', (event) => {
    const node = event.target;
    showDetail(node);
    cy.elements().removeClass('highlighted dimmed');
    const connected = node.neighborhood().add(node).add(node.ancestors()).add(node.descendants());
    cy.elements().not(connected).addClass('dimmed');
    connected.addClass('highlighted');
  });

  cy.on('tap', (event) => {
    if (event.target === cy) {
      cy.elements().removeClass('highlighted dimmed');
      document.getElementById('detail').style.display = 'none';
    }
  });

  setInfo(formatSummary(normalized.summary));
}

async function getGraphData() {
  if (GRAPH_DATA) {
    return GRAPH_DATA;
  }

  const graphRes = await safeFetch('.archviz/graph.json');
  if (graphRes) {
    return graphRes;
  }

  const cytoscapeRes = await safeFetch('.archviz/cytoscape.json');
  if (cytoscapeRes) {
    return cytoscapeRes;
  }

  return null;
}

async function safeFetch(path) {
  try {
    const response = await fetch(path);
    if (!response.ok) return null;
    return await response.json();
  } catch {
    return null;
  }
}

function normalizeGraph(raw) {
  if (Array.isArray(raw)) {
    return {
      elements: raw,
      summary: buildSummaryFromElements(raw, {})
    };
  }

  if (raw && Array.isArray(raw.cytoscape_elements)) {
    const summary = raw.summary || {};
    return {
      elements: raw.cytoscape_elements,
      summary: buildSummaryFromElements(raw.cytoscape_elements, {
        total_files: summary.total_files,
        total_symbols: summary.total_symbols,
        total_edges: summary.total_edges,
        total_loc: summary.total_loc,
        framework: summary.detected_framework
      })
    };
  }

  if (raw && raw.elements && Array.isArray(raw.elements.nodes) && Array.isArray(raw.elements.edges)) {
    const elements = [
      ...raw.elements.nodes.map((node) => ({ group: 'nodes', data: node.data })),
      ...raw.elements.edges.map((edge) => ({ group: 'edges', data: edge.data }))
    ];
    const snapshot = raw.snapshot || {};
    return {
      elements,
      summary: buildSummaryFromElements(elements, {
        total_files: snapshot.total_files,
        total_symbols: snapshot.total_symbols,
        total_edges: snapshot.total_edges,
        total_loc: snapshot.total_loc,
        framework: snapshot.framework
      })
    };
  }

  return {
    elements: [],
    summary: buildSummaryFromElements([], {})
  };
}

function buildSummaryFromElements(elements, base) {
  const nodeElements = elements.filter((item) => item.group === 'nodes');
  const edgeElements = elements.filter((item) => item.group === 'edges');

  const fileCount = nodeElements.filter((item) => item.data && item.data.type === 'file').length;
  const symbolCount = nodeElements.filter((item) => item.data && item.data.type === 'symbol').length;
  const totalLoc = nodeElements
    .filter((item) => item.data && item.data.type === 'file')
    .reduce((sum, item) => sum + Number(item.data.loc || 0), 0);

  return {
    total_files: hasValue(base.total_files) ? base.total_files : fileCount,
    total_symbols: hasValue(base.total_symbols) ? base.total_symbols : symbolCount,
    total_edges: hasValue(base.total_edges) ? base.total_edges : edgeElements.length,
    total_loc: hasValue(base.total_loc) ? base.total_loc : totalLoc,
    framework: base.framework || undefined
  };
}

function formatSummary(summary) {
  const parts = [
    `${Number(summary.total_files || 0)} files`,
    `${Number(summary.total_symbols || 0)} symbols`,
    `${Number(summary.total_edges || 0)} edges`,
    `${Number(summary.total_loc || 0).toLocaleString()} LOC`
  ];
  if (summary.framework) {
    parts.push(String(summary.framework));
  }
  return parts.join(' - ');
}

function showDetail(node) {
  const data = node.data();
  const panel = document.getElementById('detail');
  const typeColor = data.type === 'symbol'
    ? (SUBTYPE_COLORS[data.subtype] || '#64748b')
    : data.type === 'layer'
      ? (COLORS[data.label] || '#64748b')
      : '#3b82f6';

  let html = `<h3>${escapeHtml(data.label || '')}</h3>`;
  html += `<span class="badge" style="background:${typeColor}22;color:${typeColor};border:1px solid ${typeColor}44">${escapeHtml(data.subtype || data.type || '')}</span>`;

  if (hasValue(data.file_path)) html += fieldHtml('Path', data.file_path);
  if (hasValue(data.loc)) html += fieldHtml('Lines of Code', data.loc);
  if (hasValue(data.complexity)) html += fieldHtml('Complexity', data.complexity);
  if (hasValue(data.export_count)) html += fieldHtml('Exports', data.export_count);
  if (hasValue(data.import_count)) html += fieldHtml('Imports', data.import_count);
  if (hasValue(data.is_exported)) html += fieldHtml('Exported', data.is_exported ? 'Yes' : 'No');
  if (hasValue(data.is_async)) html += fieldHtml('Async', data.is_async ? 'Yes' : 'No');
  if (hasValue(data.params)) html += fieldHtml('Params', formatParams(data.params));
  if (hasValue(data.return_type)) html += fieldHtml('Return Type', data.return_type);

  const edges = node.connectedEdges();
  if (edges.length > 0) {
    html += `<div class="field" style="margin-top:12px"><div class="label">Connections (${edges.length})</div>`;
    edges.forEach((edge) => {
      const sourceLabel = edge.source().data('label');
      const targetLabel = edge.target().data('label');
      const isOutgoing = edge.source().id() === node.id();
      const arrow = isOutgoing ? '->' : '<-';
      const other = isOutgoing ? targetLabel : sourceLabel;
      html += `<div class="value" style="margin-bottom:2px">${arrow} ${escapeHtml(other)} <span style="color:#64748b">(${escapeHtml(edge.data('type'))})</span></div>`;
    });
    html += '</div>';
  }

  panel.innerHTML = html;
  panel.style.display = 'block';
}

function fieldHtml(label, value) {
  return `<div class="field"><div class="label">${escapeHtml(String(label))}</div><div class="value">${escapeHtml(String(value))}</div></div>`;
}

function formatParams(params) {
  if (!Array.isArray(params)) {
    return String(params);
  }
  const mapped = params.map((param) => {
    if (typeof param === 'string') return param;
    if (param && typeof param === 'object' && 'name' in param) return String(param.name);
    return JSON.stringify(param);
  });
  return mapped.join(', ');
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function hasValue(value) {
  return value !== undefined && value !== null;
}

function setInfo(text) {
  document.getElementById('info').textContent = text;
}

function fitGraph() {
  if (cy) cy.fit(null, 30);
}

function zoomBy(multiplier) {
  if (!cy) return;
  cy.zoom(cy.zoom() * multiplier);
  cy.center();
}

function runLayout(name) {
  if (!cy) return;
  const options = name === 'cose'
    ? { name: 'cose', animate: true, animationDuration: 500, nodeRepulsion: 8000, idealEdgeLength: 80, padding: 40 }
    : name === 'breadthfirst'
      ? { name: 'breadthfirst', animate: true, animationDuration: 500, directed: true, padding: 40, spacingFactor: 1.2 }
      : { name, animate: true, animationDuration: 500, padding: 40 };
  cy.layout(options).run();
}

function toggleSymbols() {
  if (!cy) return;
  showSymbols = !showSymbols;
  cy.nodes('[type="symbol"]').style('display', showSymbols ? 'element' : 'none');
}

init();
</script>
</body>
</html>
